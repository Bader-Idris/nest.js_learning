services:
  postgres:
      # image: postgres:16-alpine3.18
      image: postgres:17.5-alpine3.22
      container_name: psql
      restart: always
      ports:
        - 5434:5432
        # to be exported to 5434
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: example
        POSTGRES_DB: nest
      volumes:
        - psql-data:/var/lib/postgresql/data:rw  # 🔴chmod +x if (node.length > 1)🔴
      #   - ./server/config/psql/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      networks:
        - postgres

    # adminer:  # I think it's not important to obtain
    #   image: adminer
    #   restart: always
    #   ports:
    #     - 8080:8080
  testing-postgres:
      # image: postgres:16-alpine3.18
      image: postgres:17.5-alpine3.22
      container_name: testing-psql
      restart: always
      ports:
        - 5435:5432
        # to be exported to 5434
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: example
        POSTGRES_DB: nest
      volumes:
        - testing-psql-data:/var/lib/postgresql/data:rw  # 🔴chmod +x if (node.length > 1)🔴
      #   - ./server/config/psql/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      networks:
        - postgres

networks:
  postgres:
  testing-postgres:
    # driver: bridge

volumes:
  psql-data:
  testing-psql-data:
